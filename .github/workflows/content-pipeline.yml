name: Content pipeline

on:
  schedule:
    # 06:30 UTC daily = 08:30 Europe/Warsaw in summer, 07:30 in winter.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish with draft: true instead of going live"
        type: boolean
        default: false
      dry_run:
        description: "Generate and print the post, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

# Two runs must never race for the same push. A queued run is dropped rather
# than allowed to publish a second post the same day.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: automation

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: automation/pyproject.toml

      - name: Install the pipeline
        # dev group included: the style gate below runs pytest.
        run: uv sync --frozen

      - name: Run the pipeline
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          AIBH_MODEL: ${{ vars.AIBH_MODEL }}
          AIBH_LOG_LEVEL: INFO
        run: |
          set +e
          uv run aibh-pipeline run \
            ${{ inputs.draft && '--draft' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = published or day deliberately skipped. 3 = quality rejection,
          # which is a skipped day too but should page the owner.
          exit $code

      - name: Set up Node
        if: steps.pipeline.outputs.published == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Smoke build the site with the new post
        if: steps.pipeline.outputs.published == 'true'
        working-directory: .
        run: |
          npm ci
          npm run build

      - name: Style gate on the new post
        if: steps.pipeline.outputs.published == 'true'
        run: uv run pytest tests/test_banned_patterns.py -q

      # The pipeline already scrubbed the post on its way to disk. This proves
      # it, before the commit rather than after: if the cleaner was missing at
      # run time it degrades to a pass-through, and that has to stop the push
      # instead of showing up as a red CI run on main.
      - name: Unicode hygiene gate on the new post
        if: steps.pipeline.outputs.published == 'true'
        working-directory: .
        run: python3 scripts/check-content-hygiene.py "${{ steps.pipeline.outputs.path }}"

      - name: Commit and push
        if: steps.pipeline.outputs.published == 'true'
        working-directory: .
        run: |
          git config user.name  "aibuilderhub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog automation/state
          git commit -m "content: ${{ steps.pipeline.outputs.slug }}

          Generated by the daily content pipeline."
          # Rebase rather than force: a human commit landing mid-run wins.
          git pull --rebase origin main
          git push origin HEAD:main

      # A skipped day still changes state: the topic that failed review is
      # recorded so tomorrow does not pick it again. Without this the failure
      # registry only ever persisted on days that published, which is exactly
      # the days it has nothing to say.
      - name: Persist state after a skipped day
        if: always() && steps.pipeline.outputs.published != 'true'
        working-directory: .
        run: |
          if git diff --quiet -- automation/state; then
            echo "no state change to commit"
            exit 0
          fi
          git config user.name  "aibuilderhub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state
          git commit -m "chore(state): record skipped run"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run
          path: automation/state/last_run.json
          if-no-files-found: ignore
          retention-days: 14
