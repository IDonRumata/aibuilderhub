name: Content pipeline

on:
  schedule:
    # Every day, twice. This is not a request for a daily post: the number of
    # posts is decided by the weekly quota in automation/services/cadence.py,
    # which targets three a week and refuses to write on a day that is already
    # on target. What a daily cron buys is recovery.
    #
    # The old schedule was Mondays and Thursdays. Two fixed slots meant that a
    # slot which produced nothing - critics rejected the story, GitHub dropped
    # the cron, the feeds were thin - cost three or four days of silence. Four
    # scheduled slots between 24 August and 7 September produced one post.
    #
    # A day that is on target costs nothing at all: the quota is checked before
    # any feed is fetched and before the model client is opened.
    #
    # The second run is insurance, not a second post. GitHub delays scheduled
    # jobs under load and sometimes drops them outright - runs have been
    # observed at 11:29 and 14:15 for an 06:30 cron, and 7 September never
    # fired at all. If the morning run went missing, the afternoon one does the
    # work; if it did not, the afternoon run sees the spacing rule and stops.
    - cron: "30 6 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish with draft: true instead of going live"
        type: boolean
        default: false
      dry_run:
        description: "Generate and print the post, write nothing"
        type: boolean
        default: false
      force:
        description: "Publish even if the week is already on target"
        type: boolean
        default: false

permissions:
  contents: write

# Two runs must never race for the same push. A queued run waits rather than
# publishing alongside the one already in flight.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: automation

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: automation/pyproject.toml

      - name: Install the pipeline
        # dev group included: the style gate below runs pytest.
        run: uv sync --frozen

      - name: Run the pipeline
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          AIBH_MODEL: ${{ vars.AIBH_MODEL }}
          AIBH_LOG_LEVEL: INFO
        run: |
          set +e
          uv run aibh-pipeline run \
            ${{ inputs.draft && '--draft' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = published, or the day was deliberately skipped (on target, or
          # nothing worth writing about). 3 = every topic tried was rejected,
          # which is a skipped day too but should page the owner.
          exit $code

      - name: Set up Node
        if: steps.pipeline.outputs.published == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Smoke build the site with the new post
        if: steps.pipeline.outputs.published == 'true'
        working-directory: .
        run: |
          npm ci
          npm run build

      - name: Style gate on the new post
        if: steps.pipeline.outputs.published == 'true'
        run: uv run pytest tests/test_banned_patterns.py -q

      - name: Commit and push
        if: steps.pipeline.outputs.published == 'true'
        working-directory: .
        run: |
          git config user.name  "aibuilderhub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog automation/state
          git commit -m "content: ${{ steps.pipeline.outputs.slugs }}

          Generated by the content pipeline."
          # Rebase rather than force: a human commit landing mid-run wins.
          git pull --rebase origin main
          git push origin HEAD:main

      # Committing a post is not publishing it. Between 3 and 9 September the
      # site served a build made on 1 September: three posts sat in main, none
      # of them drafts, all of them building cleanly here, and every one of them
      # returned 404 to readers.
      #
      # Deploying was never this workflow's job and does not need a secret. The
      # custom domain is served by a Cloudflare Worker named aibuilderhub, wired
      # to this repository by Workers Builds, which does rebuild on every push -
      # it was failing on every push instead, for the reason recorded at the top
      # of wrangler.jsonc. The repository now carries that configuration, so a
      # push puts the post live again.
      #
      # What was missing all along is this check. A deploy that dies on
      # Cloudflare's side leaves this run green, so the only way anyone found
      # out the site was a week stale was by opening it. Ask the live site.
      - name: Wait for the live site to serve the new post
        if: steps.pipeline.outputs.published == 'true'
        working-directory: .
        env:
          # Through the environment rather than inlined into the script: a step
          # output must never be pasted into a shell command.
          SLUGS: ${{ steps.pipeline.outputs.slugs }}
        run: |
          slug="${SLUGS%%,*}"
          url="https://aibuilderhub.app/blog/${slug}/"
          echo "waiting for ${url}"
          code=000
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              echo "the post is live"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::${url} still answers ${code}. The post is committed           but readers cannot see it. Open the aibuilderhub Worker in Cloudflare,           read the newest entry under Deployments -> build history, and see           SETUP-DEPLOY.md."

      # A skipped day still changes state: the topic that failed review is
      # recorded so tomorrow does not pick it again. Without this the failure
      # registry only ever persisted on days that published, which is exactly
      # the days it has nothing to say.
      - name: Persist state after a skipped day
        if: always() && steps.pipeline.outputs.published != 'true'
        working-directory: .
        run: |
          if git diff --quiet -- automation/state; then
            echo "no state change to commit"
            exit 0
          fi
          git config user.name  "aibuilderhub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state
          git commit -m "chore(state): record skipped run"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run
          path: automation/state/last_run.json
          if-no-files-found: ignore
          retention-days: 14
