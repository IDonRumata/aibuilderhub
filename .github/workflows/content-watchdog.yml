name: Content watchdog

# Nobody was watching. Between 24 August and 7 September the pipeline
# published one post out of four scheduled attempts, and the only way to find
# out was to open the Actions tab and read the logs - a skipped day exits 0 and
# looks exactly like a healthy one from the outside.
#
# This job asks the two questions that matter - when did the pipeline last
# publish, and can a reader actually open what it published? - and turns a bad
# answer into a GitHub issue, which arrives as email. It never touches the
# model and costs nothing.
#
# The second question was added on 9 September, after six days in which the
# first one answered healthy and readers still saw 404. The pipeline was
# writing posts, the runs were green, this watchdog was satisfied, and the
# deploy on Cloudflare's side had been failing since 3 September. A registry
# entry is a promise that a post exists, not evidence that anyone can read it.

on:
  schedule:
    # Two hours after the afternoon pipeline run, so a run that was going to
    # fix the silence has already had its chance.
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      stall_hours:
        description: "Override the stall threshold in hours (to test the alert)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: content-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: How long since the pipeline last published
        id: check
        env:
          # A quiet stretch longer than this means something is wrong. The quota
          # targets three posts a week with at least 36 hours between them, so
          # four days without a post cannot happen while the pipeline is
          # healthy. Overridable by hand so the alert path can be exercised
          # without waiting four days for a real outage.
          STALL_HOURS: ${{ inputs.stall_hours || '96' }}
        run: |
          set -euo pipefail
          state="automation/state/published_topics.json"
          if [ ! -s "$state" ]; then
            echo "no state file yet, nothing to judge"
            echo "stalled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Trimmed to whole seconds: the registry writes microseconds, which
          # older date(1) builds refuse to parse.
          last=$(jq -r '[.[].published_at] | sort | last | .[0:19]' "$state")
          if [ -z "$last" ] || [ "$last" = "null" ]; then
            echo "registry is empty"
            echo "stalled=true" >> "$GITHUB_OUTPUT"
            echo "hours=unknown" >> "$GITHUB_OUTPUT"
            echo "last=never" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_epoch=$(date -u -d "$last UTC" +%s)
          hours=$(( ( $(date -u +%s) - last_epoch ) / 3600 ))
          echo "last published $last UTC, $hours hours ago"
          echo "hours=$hours" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ "$hours" -ge "${STALL_HOURS}" ]; then
            echo "stalled=true" >> "$GITHUB_OUTPUT"
          else
            echo "stalled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise a stall issue
        if: steps.check.outputs.stalled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOURS: ${{ steps.check.outputs.hours }}
          LAST: ${{ steps.check.outputs.last }}
        run: |
          set -euo pipefail
          gh label create pipeline-stall \
            --color B60205 \
            --description "The content pipeline has stopped publishing" \
            2>/dev/null || true

          open=$(gh issue list --label pipeline-stall --state open --json number \
            --jq 'length')
          if [ "$open" != "0" ]; then
            echo "a stall issue is already open; not opening a second one"
            exit 0
          fi

          gh issue create \
            --title "Content pipeline has published nothing for ${HOURS}h" \
            --label pipeline-stall \
            --body "$(cat <<EOF
          The last automated post landed at **${LAST} UTC**, ${HOURS} hours ago.
          The quota targets three posts a week, so this gap is not normal.

          Where to look, in order:

          1. **Actions, Content pipeline** - the recent runs. A run whose job
             summary says *on schedule* is healthy and deliberate. One that says
             *topic(s) tried and rejected* is a quality problem, and the summary
             names the reason.
          2. **Missing runs entirely.** GitHub delays and sometimes drops
             scheduled jobs. Run the workflow by hand:
             \`gh workflow run content-pipeline.yml -f force=true\`
          3. **The month's budget.** \`automation/state/usage.json\`. Once the
             monthly ceiling is reached the pipeline refuses to start until the
             month rolls over, and that reads as silence.

          This issue closes itself once a post goes out.
          EOF
          )"

      # The pipeline can be perfectly healthy and the site still stale: the
      # deploy runs on Cloudflare, not here, and its failures are invisible
      # from GitHub. So ask the site itself, over HTTP, the way a reader would.
      - name: Can a reader open the newest post
        id: live
        run: |
          set -euo pipefail
          # By publication date out of the frontmatter, not by file mtime: a
          # fresh checkout stamps every file with the same timestamp.
          newest=$(for f in src/content/blog/*.md; do
            grep -qE '^draft:[[:space:]]*true' "$f" && continue
            day=$(grep -m1 -oE '^pubDate:.*[0-9]{4}-[0-9]{2}-[0-9]{2}' "$f"               | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
            echo "${day:-0000-00-00} $f"
          done | sort | tail -1 | cut -d' ' -f2)

          slug=$(basename "$newest" .md)
          url="https://aibuilderhub.app/blog/${slug}/"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$url" || echo 000)
          echo "$url -> HTTP $code"
          echo "slug=$slug"  >> "$GITHUB_OUTPUT"
          echo "url=$url"    >> "$GITHUB_OUTPUT"
          echo "code=$code"  >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise a stale-site issue
        if: steps.live.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.live.outputs.url }}
          CODE: ${{ steps.live.outputs.code }}
        run: |
          set -euo pipefail
          gh label create site-stale             --color D93F0B             --description "Posts are in main but the live site does not serve them"             2>/dev/null || true

          open=$(gh issue list --label site-stale --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "a stale-site issue is already open; not opening a second one"
            exit 0
          fi

          gh issue create             --title "The newest post is in main but answers ${CODE} to readers"             --label site-stale             --body "$(cat <<EOF
          \`${URL}\` answers **HTTP ${CODE}**. The post is committed, is not a
          draft, and builds here - so this is the deploy, not the writing.

          Where to look, in order:

          1. **Cloudflare dashboard, Workers & Pages, \`aibuilderhub\`** - the
             row whose custom domain is aibuilderhub.app. Open Deployments, then
             build history. A red row is a failed deploy; the real error is in
             the last twenty lines of its log.
          2. **Retry build** on that same page. It needs no token.
          3. **\`SETUP-DEPLOY.md\`** for the failure this has taken before and
             what \`wrangler.jsonc\` is there to prevent.

          This issue closes itself once the newest post answers 200.
          EOF
          )"

      - name: Close the stale-site issue once the post is readable
        if: steps.live.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail
          for number in $(gh issue list --label site-stale --state open             --json number --jq '.[].number'); do
            gh issue close "$number" --comment "The site is current again: ${URL} answers 200."
          done

      - name: Close the stall issue once posts resume
        if: steps.check.outputs.stalled == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOURS: ${{ steps.check.outputs.hours }}
        run: |
          set -euo pipefail
          for number in $(gh issue list --label pipeline-stall --state open \
            --json number --jq '.[].number'); do
            gh issue close "$number" \
              --comment "Publishing resumed: the last post is ${HOURS}h old."
          done
