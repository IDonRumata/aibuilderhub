name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site build and npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

  pipeline:
    name: Pipeline tests, lint and pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: automation/pyproject.toml
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        env:
          ANTHROPIC_API_KEY: not-used-by-the-test-suite
        run: uv run pytest -q
      - name: pip-audit (fail on any known vulnerability)
        # Audit the exported lock rather than the installed environment: the
        # local package is editable and has no PyPI release to check against.
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes -o /tmp/reqs.txt
          uv run pip-audit -r /tmp/reqs.txt --strict --progress-spinner off

  secrets:
    name: Secret scan over the full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # The action already passes --fail; repeating it is a parse error.
          extra_args: --results=verified,unknown
