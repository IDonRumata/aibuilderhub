# Candidate sources for the daily content pipeline.
#
# Only official feeds and public APIs — no HTML scraping of other people's
# articles. A source that fails is logged and skipped; the run continues.
#
# weight scales a source's contribution to the virality score. Raise it for
# outlets whose coverage maps closely onto this site's niche.

rss:
  - name: techcrunch-ai
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    weight: 1.0
  - name: venturebeat-ai
    url: https://venturebeat.com/category/ai/feed/
    weight: 1.0
  - name: the-verge-ai
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    weight: 1.0
  - name: ars-technica
    url: https://feeds.arstechnica.com/arstechnica/technology-lab
    weight: 0.8
  - name: simon-willison
    url: https://simonwillison.net/atom/everything/
    weight: 1.2
  - name: hn-frontpage-rss
    url: https://hnrss.org/frontpage?points=100
    weight: 0.9
  - name: github-blog
    url: https://github.blog/feed/
    weight: 0.9
  - name: vercel-blog
    url: https://vercel.com/atom
    weight: 0.9
  - name: openai-news
    url: https://openai.com/news/rss.xml
    weight: 1.2
  - name: googleblog-ai
    url: https://blog.google/technology/ai/rss/
    weight: 1.0
  - name: hf-blog
    url: https://huggingface.co/blog/feed.xml
    weight: 0.8

  # --- added 1 Sep 2026 -------------------------------------------------
  # Picked by measuring what each feed actually delivers, not by reputation:
  # items published in the last 36 hours, items in the last 7 days, and the
  # average length of the text that comes with them. A feed that publishes
  # weekly or ships headline-only entries cannot feed this pipeline, because
  # the writer needs material and the fact-checker rejects invented filler.

  # Hacker News, filtered to this site's subject matter. The highest-yield
  # addition: 11 fresh items in 36 hours, all on-niche by construction.
  - name: hn-nocode
    url: https://hnrss.org/newest?q=no-code+OR+%22vibe+coding%22+OR+%22AI+agent%22&points=40
    weight: 1.3
  - name: hn-ai-tools
    url: https://hnrss.org/newest?q=Cursor+OR+%22Claude+Code%22+OR+Lovable&points=40
    weight: 1.3
  - name: hn-show
    url: https://hnrss.org/show?points=80
    weight: 1.0

  # Dedicated AI newsrooms. Daily cadence, summaries long enough to write from.
  - name: the-decoder
    url: https://the-decoder.com/feed/
    weight: 1.1
  - name: marktechpost
    url: https://www.marktechpost.com/feed/
    weight: 1.0
  - name: infoq-ai
    url: https://feed.infoq.com/ai-ml-data-eng/
    weight: 1.0

  # Developer-facing. dev.to carries the most fresh items of anything tested
  # (12 in 36 hours) with real article bodies; weighted down because it is
  # user-generated and the quality spread is wide.
  - name: devto-ai
    url: https://dev.to/feed/tag/ai
    weight: 0.8
  - name: latent-space
    url: https://www.latent.space/feed
    weight: 1.2

  # Lower cadence, but squarely on-niche and long-form. These are the feeds
  # that carry a quiet day.
  - name: github-changelog
    url: https://github.blog/changelog/feed/
    weight: 1.1
  - name: zapier-blog
    url: https://zapier.com/blog/feeds/latest/
    weight: 1.0
  - name: n8n-blog
    url: https://blog.n8n.io/rss/
    weight: 1.1
  - name: cloudflare-blog
    url: https://blog.cloudflare.com/rss/
    weight: 0.9

hackernews:
  - name: hackernews
    listing: topstories
    limit: 80
    min_points: 60
    weight: 1.1

reddit:
  # r/SideProject and r/indiehackers were removed on 1 Sep 2026: between them
  # they supplied 25 candidates in one window and all 25 were "I built X"
  # posts that selection discards. See scoring.is_self_promo.
  - subreddit: nocode
    sort: top
    period: day
    limit: 25
    min_upvotes: 15
    weight: 1.3
  - subreddit: ChatGPTCoding
    sort: top
    period: day
    limit: 25
    min_upvotes: 40
    weight: 1.3
  - subreddit: LocalLLaMA
    sort: top
    period: day
    limit: 25
    min_upvotes: 150
    weight: 0.9

# ---------------------------------------------------------------------------
# Scoring vocabulary. Matched against the normalised title + summary.
# ---------------------------------------------------------------------------

niche:
  # Squarely what this site covers — the strongest positive signal.
  core:
    - vibe coding
    - no-code
    - nocode
    - low-code
    - app builder
    - ai coding
    - coding agent
    - solopreneur
    - indie hacker
    - side project
    - saas mvp
    - prompt engineering
    - ai agent
    - agentic

  # Named tools the site reviews or compares.
  tools:
    - cursor
    - lovable
    - bolt.new
    - replit
    - windsurf
    - v0
    - claude code
    - github copilot
    - codex
    - gemini cli
    - devin
    - webflow
    - framer
    - bubble
    - n8n
    - zapier
    - supabase
    - vercel
    - netlify
    - figma make

  # Adjacent and still worth covering, but weaker.
  adjacent:
    - openai
    - anthropic
    - claude
    - chatgpt
    - gemini
    - llama
    - mistral
    - api pricing
    - context window
    - benchmark
    - open source model

  # Off-niche. Interesting to Hacker News, useless to this audience.
  penalty:
    - crypto
    - bitcoin
    - ethereum
    - blockchain
    - nft
    - token price
    - election
    - senate
    - congress
    - lawsuit filed
    - tariff
    - gpu shortage
    - data center construction
    - quantum supremacy
    - stock split
    - earnings call
    - layoffs at
    - acquisition talks
