# Candidate sources for the daily content pipeline.
#
# Only official feeds and public APIs — no HTML scraping of other people's
# articles. A source that fails is logged and skipped; the run continues.
#
# weight scales a source's contribution to the virality score. Raise it for
# outlets whose coverage maps closely onto this site's niche.

rss:
  - name: techcrunch-ai
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    weight: 1.0
  - name: venturebeat-ai
    url: https://venturebeat.com/category/ai/feed/
    weight: 1.0
  - name: the-verge-ai
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    weight: 1.0
  - name: ars-technica
    url: https://feeds.arstechnica.com/arstechnica/technology-lab
    weight: 0.8
  - name: simon-willison
    url: https://simonwillison.net/atom/everything/
    weight: 1.2
  - name: hn-frontpage-rss
    url: https://hnrss.org/frontpage?points=100
    weight: 0.9
  - name: github-blog
    url: https://github.blog/feed/
    weight: 0.9
  - name: vercel-blog
    url: https://vercel.com/atom
    weight: 0.9
  - name: openai-news
    url: https://openai.com/news/rss.xml
    weight: 1.2
  - name: googleblog-ai
    url: https://blog.google/technology/ai/rss/
    weight: 1.0
  - name: hf-blog
    url: https://huggingface.co/blog/feed.xml
    weight: 0.8

hackernews:
  - name: hackernews
    listing: topstories
    limit: 80
    min_points: 60
    weight: 1.1

reddit:
  - subreddit: SideProject
    sort: top
    period: day
    limit: 25
    min_upvotes: 60
    weight: 1.2
  - subreddit: nocode
    sort: top
    period: day
    limit: 25
    min_upvotes: 15
    weight: 1.3
  - subreddit: ChatGPTCoding
    sort: top
    period: day
    limit: 25
    min_upvotes: 40
    weight: 1.3
  - subreddit: LocalLLaMA
    sort: top
    period: day
    limit: 25
    min_upvotes: 150
    weight: 0.9
  - subreddit: indiehackers
    sort: top
    period: day
    limit: 25
    min_upvotes: 15
    weight: 1.2

# ---------------------------------------------------------------------------
# Scoring vocabulary. Matched against the normalised title + summary.
# ---------------------------------------------------------------------------

niche:
  # Squarely what this site covers — the strongest positive signal.
  core:
    - vibe coding
    - no-code
    - nocode
    - low-code
    - app builder
    - ai coding
    - coding agent
    - solopreneur
    - indie hacker
    - side project
    - saas mvp
    - prompt engineering
    - ai agent
    - agentic

  # Named tools the site reviews or compares.
  tools:
    - cursor
    - lovable
    - bolt.new
    - replit
    - windsurf
    - v0
    - claude code
    - github copilot
    - codex
    - gemini cli
    - devin
    - webflow
    - framer
    - bubble
    - n8n
    - zapier
    - supabase
    - vercel
    - netlify
    - figma make

  # Adjacent and still worth covering, but weaker.
  adjacent:
    - openai
    - anthropic
    - claude
    - chatgpt
    - gemini
    - llama
    - mistral
    - api pricing
    - context window
    - benchmark
    - open source model

  # Off-niche. Interesting to Hacker News, useless to this audience.
  penalty:
    - crypto
    - bitcoin
    - ethereum
    - blockchain
    - nft
    - token price
    - election
    - senate
    - congress
    - lawsuit filed
    - tariff
    - gpu shortage
    - data center construction
    - quantum supremacy
    - stock split
    - earnings call
    - layoffs at
    - acquisition talks
