[project]
name = "aibh-pipeline"
version = "1.0.0"
description = "Autonomous content pipeline for aibuilderhub.app"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "structlog>=24.4",
    "python-slugify>=8.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
aibh-pipeline = "aibh_pipeline.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pip-audit>=2.7",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibh_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:aibh_pipeline.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # pytest relies on assert
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Verdict.PASS is a review verdict, not a credential.
"src/aibh_pipeline/models.py" = ["S105"]
"src/aibh_pipeline/textutil.py" = ["SIM905"]
